<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✍️ 每日写作统计 - 卡通版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --bg: #FFF8F3;
            --card-bg: #FFFFFF;
            --coral: #FF8C94;
            --coral-light: #FFB3B8;
            --mint: #7ECB9A;
            --mint-light: #B8E6C8;
            --sky: #7EC8E3;
            --sky-light: #B8E0F0;
            --lavender: #C3AED6;
            --lavender-light: #E0D4EC;
            --peach: #FFB386;
            --peach-light: #FFD4B8;
            --yellow: #FFD97D;
            --yellow-light: #FFEBB8;
            --text: #5D4E4E;
            --text-light: #8B7B7B;
            --text-lighter: #B5A8A8;
            --shadow-sm: 0 2px 8px rgba(120, 100, 90, 0.08);
            --shadow-md: 0 6px 20px rgba(120, 100, 90, 0.12);
            --shadow-lg: 0 12px 32px rgba(120, 100, 90, 0.16);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 30px;
            --font-title: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --font-body: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            background-image:
                radial-gradient(circle at 8% 12%, rgba(255, 140, 148, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 85% 18%, rgba(126, 203, 154, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 15% 75%, rgba(126, 200, 227, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 78% 80%, rgba(255, 179, 134, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(195, 174, 214, 0.04) 0%, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 漂浮装饰 */
        .floating-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .float-item {
            position: absolute;
            font-size: 2rem;
            opacity: 0.55;
            animation: floatAround 18s ease-in-out infinite;
            filter: blur(0.5px);
            transition: opacity 0.8s;
        }
        .float-item:nth-child(1) {
            top: 6%;
            left: 5%;
            animation-delay: 0s;
            animation-duration: 16s;
            font-size: 2.4rem;
        }
        .float-item:nth-child(2) {
            top: 12%;
            right: 8%;
            animation-delay: -4s;
            animation-duration: 20s;
            font-size: 1.8rem;
        }
        .float-item:nth-child(3) {
            top: 55%;
            left: 3%;
            animation-delay: -8s;
            animation-duration: 19s;
            font-size: 2.6rem;
        }
        .float-item:nth-child(4) {
            top: 70%;
            right: 5%;
            animation-delay: -12s;
            animation-duration: 17s;
            font-size: 2rem;
        }
        .float-item:nth-child(5) {
            top: 30%;
            left: 88%;
            animation-delay: -6s;
            animation-duration: 22s;
            font-size: 1.6rem;
        }
        .float-item:nth-child(6) {
            top: 82%;
            left: 45%;
            animation-delay: -10s;
            animation-duration: 21s;
            font-size: 2.2rem;
        }

        @keyframes floatAround {
            0%,
            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            15% {
                transform: translate(18px, -22px) rotate(6deg) scale(1.08);
            }
            30% {
                transform: translate(-12px, -10px) rotate(-4deg) scale(0.94);
            }
            45% {
                transform: translate(20px, 16px) rotate(7deg) scale(1.05);
            }
            60% {
                transform: translate(-16px, 20px) rotate(-5deg) scale(0.96);
            }
            75% {
                transform: translate(8px, -18px) rotate(3deg) scale(1.03);
            }
            90% {
                transform: translate(-10px, 8px) rotate(-2deg) scale(0.98);
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 头部 */
        .header {
            text-align: center;
            padding: 10px 0 0;
        }
        .header .logo-row {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 14px 28px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            transition: transform var(--transition), box-shadow var(--transition);
        }
        .header .logo-row:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }
        .header .logo-icon {
            font-size: 2.6rem;
            animation: bounceIcon 1.8s ease-in-out infinite;
        }
        @keyframes bounceIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-10px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-5px);
            }
            85% {
                transform: translateY(0);
            }
        }
        .header h1 {
            font-family: var(--font-title);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--coral);
            letter-spacing: 0.03em;
            line-height: 1.2;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-top: 2px;
            letter-spacing: 0.02em;
        }

        /* 内容区 */
        .content-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* 输入面板 */
        .input-panel {
            flex: 1 1 340px;
            min-width: 300px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 22px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: box-shadow var(--transition);
            position: relative;
            overflow: hidden;
        }
        .input-panel::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 90px;
            height: 90px;
            background: var(--coral-light);
            border-radius: 50%;
            opacity: 0.25;
            pointer-events: none;
            z-index: 0;
        }
        .input-panel::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: -25px;
            width: 70px;
            height: 70px;
            background: var(--sky-light);
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }
        .input-panel>* {
            position: relative;
            z-index: 1;
        }
        .input-panel .section-title {
            font-family: var(--font-title);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .input-panel .section-title .icon {
            font-size: 1.5rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.02em;
        }
        .input-group label .label-emoji {
            font-size: 1.2rem;
        }
        .input-group .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-group input[type="number"] {
            flex: 1;
            padding: 13px 16px;
            border: 2.5px solid #E8E0DA;
            border-radius: var(--radius-md);
            font-size: 1.05rem;
            font-family: var(--font-body);
            color: var(--text);
            background: #FDFAF7;
            transition: all var(--transition);
            outline: none;
            min-width: 0;
            letter-spacing: 0.02em;
        }
        .input-group input[type="number"]:focus {
            border-color: var(--coral);
            background: #FFF;
            box-shadow: 0 0 0 6px rgba(255, 140, 148, 0.08);
            transform: translateY(-1px);
        }
        .input-group input[type="number"]:hover {
            border-color: #D5CBC3;
        }
        .input-group .input-unit {
            font-weight: 600;
            color: var(--text-lighter);
            font-size: 0.9rem;
            white-space: nowrap;
            letter-spacing: 0.03em;
        }
        .date-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .date-input-row input[type="date"] {
            flex: 1;
            padding: 12px 14px;
            border: 2.5px solid #E8E0DA;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-family: var(--font-body);
            color: var(--text);
            background: #FDFAF7;
            transition: all var(--transition);
            outline: none;
            cursor: pointer;
            letter-spacing: 0.02em;
        }
        .date-input-row input[type="date"]:focus {
            border-color: var(--sky);
            background: #FFF;
            box-shadow: 0 0 0 6px rgba(126, 200, 227, 0.08);
        }
        .date-nav-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2.5px solid #E8E0DA;
            background: #FDFAF7;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            color: var(--text-light);
            flex-shrink: 0;
        }
        .date-nav-btn:hover {
            background: var(--sky-light);
            border-color: var(--sky);
            color: #3a7d9e;
            transform: scale(1.06);
        }
        .date-nav-btn:active {
            transform: scale(0.94);
            transition: 0.1s;
        }

        /* 昨日Beta提示 */
        .yesterday-info {
            background: #FFFEFB;
            border: 2px dashed #E8E0DA;
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.02em;
        }
        .yesterday-info .highlight {
            font-weight: 700;
            color: var(--coral);
            font-size: 1rem;
        }

        /* Total显示 */
        .total-display {
            background: linear-gradient(135deg, #FFF9F5 0%, #FFF5F0 100%);
            border: 3px solid var(--peach-light);
            border-radius: var(--radius-lg);
            padding: 16px 18px;
            text-align: center;
            transition: all var(--transition);
        }
        .total-display.pulse-once {
            animation: pulseTotal 0.6s ease-out;
        }
        @keyframes pulseTotal {
            0%,
            100% {
                transform: scale(1);
            }
            30% {
                transform: scale(1.04);
            }
            60% {
                transform: scale(0.98);
            }
        }
        .total-display .total-label {
            font-size: 0.85rem;
            color: var(--text-light);
            letter-spacing: 0.04em;
            font-weight: 600;
        }
        .total-display .total-value {
            font-family: var(--font-title);
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--peach);
            letter-spacing: 0.03em;
            transition: color 0.3s;
        }
        .total-display .total-value.goal-reached {
            color: #4CAF84;
            animation: sparkleText 0.5s ease-out;
        }
        @keyframes sparkleText {
            0%,
            100% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.12);
            }
            70% {
                transform: scale(0.95);
            }
        }
        .total-display .total-formula {
            font-size: 0.75rem;
            color: var(--text-lighter);
            margin-top: 4px;
            letter-spacing: 0.02em;
        }

        /* 按钮 */
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 22px;
            border-radius: var(--radius-xl);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            letter-spacing: 0.03em;
            transition: all var(--transition);
            font-family: var(--font-body);
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.94);
            transition: 0.1s;
        }
        .btn-save {
            flex: 2;
            min-width: 120px;
            background: var(--coral);
            color: #fff;
            box-shadow: 0 4px 14px rgba(255, 140, 148, 0.35);
            font-size: 1rem;
        }
        .btn-save:hover {
            background: #ff7a84;
            box-shadow: 0 6px 20px rgba(255, 140, 148, 0.45);
            transform: translateY(-2px);
        }
        .btn-today {
            flex: 1;
            min-width: 80px;
            background: #fff;
            color: var(--sky);
            border: 2.5px solid var(--sky-light);
        }
        .btn-today:hover {
            background: var(--sky-light);
            border-color: var(--sky);
            transform: translateY(-2px);
        }
        .btn-reset {
            flex: 1;
            min-width: 70px;
            background: #fff;
            color: var(--text-lighter);
            border: 2px solid #E8E0DA;
            font-size: 0.85rem;
        }
        .btn-reset:hover {
            background: #f9f5f1;
            border-color: #ccc;
            color: var(--text-light);
        }

        /* 图表面板 */
        .chart-panel {
            flex: 1.3 1 420px;
            min-width: 340px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 20px 18px;
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .chart-panel::before {
            content: '';
            position: absolute;
            top: -35px;
            left: -35px;
            width: 100px;
            height: 100px;
            background: var(--mint-light);
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }
        .chart-panel>* {
            position: relative;
            z-index: 1;
        }
        .chart-panel .chart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chart-panel .chart-title {
            font-family: var(--font-title);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-panel .chart-title .icon {
            font-size: 1.5rem;
        }
        .range-btns {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .range-btn {
            padding: 7px 14px;
            border-radius: 20px;
            border: 2px solid #E8E0DA;
            background: #fff;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-light);
            transition: all var(--transition);
            letter-spacing: 0.02em;
            font-family: var(--font-body);
        }
        .range-btn:hover {
            border-color: var(--mint);
            color: var(--mint);
            background: #fafff9;
        }
        .range-btn.active {
            background: var(--mint);
            color: #fff;
            border-color: var(--mint);
            box-shadow: 0 3px 10px rgba(126, 203, 154, 0.3);
        }
        .chart-container {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 280px;
            max-height: 380px;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .no-data-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-lighter);
            pointer-events: none;
            z-index: 2;
        }
        .no-data-hint .big-emoji {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 8px;
            opacity: 0.7;
        }
        .no-data-hint .hint-text {
            font-size: 0.95rem;
            letter-spacing: 0.03em;
        }

        /* 统计卡片 */
        .stats-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1 1 130px;
            min-width: 110px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 16px 14px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition);
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .stat-card .stat-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 4px;
        }
        .stat-card .stat-value {
            font-family: var(--font-title);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.03em;
        }
        .stat-card .stat-label {
            font-size: 0.78rem;
            color: var(--text-light);
            letter-spacing: 0.03em;
            font-weight: 600;
        }
        .stat-card.card-streak {
            border-top: 4px solid var(--peach);
        }
        .stat-card.card-streak .stat-value {
            color: var(--peach);
        }
        .stat-card.card-total {
            border-top: 4px solid var(--mint);
        }
        .stat-card.card-total .stat-value {
            color: #5aad70;
        }
        .stat-card.card-target {
            border-top: 4px solid var(--sky);
        }
        .stat-card.card-target .stat-value {
            color: var(--sky);
        }
        .stat-card.card-goal {
            border-top: 4px solid var(--lavender);
            cursor: pointer;
            position: relative;
        }
        .stat-card.card-goal .stat-value {
            color: var(--lavender);
        }
        .stat-card.card-goal:hover {
            background: #fdfbff;
        }
        .goal-edit-hint {
            font-size: 0.65rem;
            color: var(--text-lighter);
            position: absolute;
            bottom: 6px;
            right: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .stat-card.card-goal:hover .goal-edit-hint {
            opacity: 1;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            background: #fff;
            border-radius: var(--radius-xl);
            padding: 13px 24px;
            box-shadow: var(--shadow-lg);
            z-index: 999;
            font-weight: 700;
            letter-spacing: 0.03em;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: var(--text);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border: 3px solid var(--mint-light);
            color: #4a8c5c;
        }
        .toast.info {
            border: 3px solid var(--sky-light);
            color: #4a7d8c;
        }

        /* 庆祝粒子 */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 998;
        }
        .confetti-piece {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            animation: confettiFall 2.5s ease-out forwards;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-120px) rotate(0deg) scale(1);
                opacity: 1;
            }
            60% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .content-wrapper {
                flex-direction: column;
                gap: 16px;
            }
            .input-panel {
                min-width: auto;
                flex: 1 1 auto;
                padding: 18px 16px;
                gap: 14px;
            }
            .chart-panel {
                min-width: auto;
                flex: 1 1 auto;
                min-height: 300px;
            }
            .chart-container {
                min-height: 240px;
                max-height: 300px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .header .logo-row {
                padding: 10px 20px;
            }
            .header .logo-icon {
                font-size: 2rem;
            }
            .total-display .total-value {
                font-size: 2rem;
            }
            .stats-row {
                gap: 10px;
            }
            .stat-card {
                flex: 1 1 100px;
                min-width: 80px;
                padding: 12px 8px;
            }
            .stat-card .stat-value {
                font-size: 1.2rem;
            }
            .stat-card .stat-icon {
                font-size: 1.5rem;
            }
            .btn {
                padding: 10px 16px;
                font-size: 0.85rem;
            }
            .float-item {
                font-size: 1.3rem !important;
            }
        }
        @media (max-width: 400px) {
            .input-panel {
                padding: 14px 10px;
                gap: 10px;
            }
            .chart-panel {
                padding: 14px 10px;
            }
            .input-group input[type="number"] {
                padding: 10px 12px;
                font-size: 0.95rem;
            }
            .btn-row {
                gap: 6px;
            }
            .btn {
                padding: 10px 12px;
                font-size: 0.8rem;
                border-radius: 20px;
            }
            .range-btn {
                padding: 5px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- 漂浮装饰 -->
    <div class="floating-decorations">
        <span class="float-item">✏️</span>
        <span class="float-item">📖</span>
        <span class="float-item">🌟</span>
        <span class="float-item">📝</span>
        <span class="float-item">💡</span>
        <span class="float-item">🎀</span>
    </div>

    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>

    <!-- 庆祝粒子容器 -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo-row">
                <span class="logo-icon">✍️</span>
                <div>
                    <h1>每日写作统计</h1>
                    <p class="subtitle">记录每一个灵感的闪光时刻 ✨</p>
                </div>
            </div>
        </header>

        <!-- 内容区 -->
        <div class="content-wrapper">
            <!-- 输入面板 -->
            <section class="input-panel" id="inputPanel">
                <div class="section-title">
                    <span class="icon">📋</span> 今日数据录入
                </div>
                <!-- 日期选择 -->
                <div class="input-group">
                    <label><span class="label-emoji">📅</span> 日期</label>
                    <div class="date-input-row">
                        <button class="date-nav-btn" id="btnPrevDay" title="前一天">◀</button>
                        <input type="date" id="datePicker" title="选择日期">
                        <button class="date-nav-btn" id="btnNextDay" title="后一天">▶</button>
                        <button class="btn btn-today" id="btnToday" title="回到今天">🏠 今天</button>
                    </div>
                </div>
                <!-- Alpha输入 -->
                <div class="input-group">
                    <label for="alphaInput">
                        <span class="label-emoji">💬</span> Alpha（newly）— 当日评论新增字数
                    </label>
                    <div class="input-row">
                        <input type="number" id="alphaInput" placeholder="例如：500" min="0" step="10">
                        <span class="input-unit">字</span>
                    </div>
                </div>
                <!-- Beta输入 -->
                <div class="input-group">
                    <label for="betaInput">
                        <span class="label-emoji">📖</span> Beta（now）— 当日小说最新累计字数
                    </label>
                    <div class="input-row">
                        <input type="number" id="betaInput" placeholder="例如：3500" min="0" step="10">
                        <span class="input-unit">字</span>
                    </div>
                </div>
                <!-- 昨日Beta提示 -->
                <div class="yesterday-info" id="yesterdayInfo">
                    📌 昨日Beta累计字数：<span class="highlight" id="yesterdayBetaDisplay">0</span> 字
                    <span style="font-size:0.7rem;color:var(--text-lighter);">（自动查找前一天数据）</span>
                </div>
                <!-- Total显示 -->
                <div class="total-display" id="totalDisplay">
                    <div class="total-label">🎯 当日写作字数（Total）</div>
                    <div class="total-value" id="totalValue">0</div>
                    <div class="total-formula">= Alpha + (今日Beta − 昨日Beta)</div>
                </div>
                <!-- 按钮 -->
                <div class="btn-row">
                    <button class="btn btn-save" id="btnSave">💾 保存数据</button>
                    <button class="btn btn-reset" id="btnReset">🔄 清空表单</button>
                </div>
            </section>

            <!-- 图表面板 -->
            <section class="chart-panel" id="chartPanel">
                <div class="chart-header">
                    <div class="chart-title">
                        <span class="icon">📊</span> 每日字数可视化
                    </div>
                    <div class="range-btns">
                        <button class="range-btn active" data-range="7">7天</button>
                        <button class="range-btn" data-range="14">14天</button>
                        <button class="range-btn" data-range="30">30天</button>
                        <button class="range-btn" data-range="all">全部</button>
                    </div>
                </div>
                <div class="chart-container" id="chartContainer">
                    <canvas id="writingChart"></canvas>
                    <div class="no-data-hint" id="noDataHint">
                        <span class="big-emoji">📭</span>
                        <span class="hint-text">还没有写作记录哦～<br>快开始记录吧！</span>
                    </div>
                </div>
            </section>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-row">
            <div class="stat-card card-streak">
                <span class="stat-icon">🔥</span>
                <div class="stat-value" id="streakDays">0</div>
                <div class="stat-label">连续写作天数</div>
            </div>
            <div class="stat-card card-total">
                <span class="stat-icon">📚</span>
                <div class="stat-value" id="cumulativeTotal">0</div>
                <div class="stat-label">累计总字数</div>
            </div>
            <div class="stat-card card-target">
                <span class="stat-icon">🎯</span>
                <div class="stat-value" id="todayProgress">-</div>
                <div class="stat-label">今日进度</div>
            </div>
            <div class="stat-card card-goal" id="goalCard" title="点击修改每日目标">
                <span class="stat-icon">⭐</span>
                <div class="stat-value" id="dailyGoalDisplay">1000</div>
                <div class="stat-label">每日目标字数</div>
                <span class="goal-edit-hint">点击修改</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== DOM元素 ====================
            const datePicker = document.getElementById('datePicker');
            const alphaInput = document.getElementById('alphaInput');
            const betaInput = document.getElementById('betaInput');
            const yesterdayBetaDisplay = document.getElementById('yesterdayBetaDisplay');
            const totalValue = document.getElementById('totalValue');
            const totalDisplay = document.getElementById('totalDisplay');
            const btnSave = document.getElementById('btnSave');
            const btnReset = document.getElementById('btnReset');
            const btnToday = document.getElementById('btnToday');
            const btnPrevDay = document.getElementById('btnPrevDay');
            const btnNextDay = document.getElementById('btnNextDay');
            const noDataHint = document.getElementById('noDataHint');
            const chartContainer = document.getElementById('chartContainer');
            const toast = document.getElementById('toast');
            const confettiContainer = document.getElementById('confettiContainer');
            const rangeBtns = document.querySelectorAll('.range-btn');
            const goalCard = document.getElementById('goalCard');
            const dailyGoalDisplay = document.getElementById('dailyGoalDisplay');
            const streakDaysEl = document.getElementById('streakDays');
            const cumulativeTotalEl = document.getElementById('cumulativeTotal');
            const todayProgressEl = document.getElementById('todayProgress');

            // ==================== 常量 ====================
            const STORAGE_KEY = 'writingDailyData_v2';
            const GOAL_KEY = 'writingDailyGoal';
            const DEFAULT_GOAL = 1000;

            // ==================== 状态 ====================
            let currentDate = getTodayStr();
            let currentRange = 7;
            let chartInstance = null;

            // ==================== 工具函数 ====================
            function getTodayStr() {
                const d = new Date();
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function dateStrToDate(str) {
                const [y, m, d] = str.split('-').map(Number);
                return new Date(y, m - 1, d);
            }

            function addDays(dateStr, days) {
                const d = dateStrToDate(dateStr);
                d.setDate(d.getDate() + days);
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function getYesterdayStr(dateStr) {
                return addDays(dateStr, -1);
            }

            function getAllData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    return raw ? JSON.parse(raw) : {};
                } catch (e) {
                    return {};
                }
            }

            function saveAllData(data) {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) {
                    showToast('⚠️ 存储空间不足，请清理旧数据', 'info');
                }
            }

            function getDayData(dateStr) {
                const all = getAllData();
                return all[dateStr] || null;
            }

            function setDayData(dateStr, dayData) {
                const all = getAllData();
                all[dateStr] = dayData;
                saveAllData(all);
            }

            function getDailyGoal() {
                try {
                    const v = localStorage.getItem(GOAL_KEY);
                    return v ? parseInt(v, 10) : DEFAULT_GOAL;
                } catch (e) {
                    return DEFAULT_GOAL;
                }
            }

            function setDailyGoal(goal) {
                try {
                    localStorage.setItem(GOAL_KEY, String(goal));
                } catch (e) {}
            }

            function getYesterdayBeta(dateStr) {
                const yesterdayStr = getYesterdayStr(dateStr);
                const yesterdayData = getDayData(yesterdayStr);
                return yesterdayData ? yesterdayData.beta : 0;
            }

            function calculateTotal(alpha, beta, yesterdayBeta) {
                return Math.max(0, alpha + beta - yesterdayBeta);
            }

            // ==================== Toast ====================
            let toastTimer = null;

            function showToast(msg, type = 'success') {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.className = 'toast ' + type;
                // 强制回流
                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ==================== 庆祝粒子 ====================
            function spawnConfetti() {
                const colors = [
                    '#FF8C94', '#FFB3B8', '#7ECB9A', '#B8E6C8',
                    '#7EC8E3', '#B8E0F0', '#C3AED6', '#E0D4EC',
                    '#FFB386', '#FFD4B8', '#FFD97D', '#FFEBB8',
                    '#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB',
                ];
                const fragment = document.createDocumentFragment();
                const count = 50;
                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.top = -(Math.random() * 60 + 10) + 'px';
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.width = (Math.random() * 10 + 6) + 'px';
                    piece.style.height = (Math.random() * 10 + 6) + 'px';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
                    piece.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    piece.style.animationDelay = Math.random() * 0.8 + 's';
                    fragment.appendChild(piece);
                }
                confettiContainer.appendChild(fragment);
                setTimeout(() => {
                    confettiContainer.innerHTML = '';
                }, 3500);
            }

            // ==================== 更新UI ====================
            function updateTotalDisplay() {
                const alpha = parseInt(alphaInput.value) || 0;
                const beta = parseInt(betaInput.value) || 0;
                const yesterdayBeta = getYesterdayBeta(currentDate);
                const total = calculateTotal(alpha, beta, yesterdayBeta);
                const goal = getDailyGoal();

                yesterdayBetaDisplay.textContent = yesterdayBeta;
                totalValue.textContent = total;

                // 达到目标高亮
                if (total >= goal && total > 0) {
                    totalValue.classList.add('goal-reached');
                } else {
                    totalValue.classList.remove('goal-reached');
                }

                return { alpha, beta, yesterdayBeta, total, goal };
            }

            function pulseTotalDisplay() {
                totalDisplay.classList.remove('pulse-once');
                void totalDisplay.offsetWidth;
                totalDisplay.classList.add('pulse-once');
            }

            function loadDateData(dateStr) {
                const data = getDayData(dateStr);
                if (data) {
                    alphaInput.value = data.alpha;
                    betaInput.value = data.beta;
                } else {
                    alphaInput.value = '';
                    betaInput.value = '';
                }
                updateTotalDisplay();
            }

            function updateAllStats() {
                const all = getAllData();
                const dates = Object.keys(all).sort();
                const goal = getDailyGoal();

                // 累计总字数
                let cumulative = 0;
                dates.forEach(d => {
                    cumulative += (all[d].total || 0);
                });
                cumulativeTotalEl.textContent = cumulative.toLocaleString();

                // 连续写作天数
                let streak = 0;
                const todayStr = getTodayStr();
                let checkDate = todayStr;
                // 从今天开始往前检查
                while (true) {
                    const d = getDayData(checkDate);
                    if (d && d.total > 0) {
                        streak++;
                        checkDate = addDays(checkDate, -1);
                    } else {
                        break;
                    }
                }
                // 如果今天没有数据，再从昨天开始检查
                if (streak === 0) {
                    checkDate = addDays(todayStr, -1);
                    while (true) {
                        const d = getDayData(checkDate);
                        if (d && d.total > 0) {
                            streak++;
                            checkDate = addDays(checkDate, -1);
                        } else {
                            break;
                        }
                    }
                }
                streakDaysEl.textContent = streak;

                // 今日进度
                const todayData = getDayData(todayStr);
                if (todayData && todayData.total > 0) {
                    const pct = Math.round((todayData.total / goal) * 100);
                    todayProgressEl.textContent = pct + '%';
                    if (pct >= 100) {
                        todayProgressEl.style.color = '#4CAF84';
                    } else if (pct >= 50) {
                        todayProgressEl.style.color = '#FFB386';
                    } else {
                        todayProgressEl.style.color = '#7EC8E3';
                    }
                } else {
                    todayProgressEl.textContent = '0%';
                    todayProgressEl.style.color = '#7EC8E3';
                }

                // 每日目标显示
                dailyGoalDisplay.textContent = goal.toLocaleString();
            }

            // ==================== 图表 ====================
            function getChartData(range) {
                const all = getAllData();
                let dates = Object.keys(all).sort();
                if (dates.length === 0) return { labels: [], values: [], isEmpty: true };

                let filteredDates;
                if (range === 'all') {
                    filteredDates = dates;
                } else {
                    const endDate = dateStrToDate(getTodayStr());
                    const startDate = new Date(endDate);
                    startDate.setDate(startDate.getDate() - (range - 1));
                    const startStr = startDate.getFullYear() + '-' +
                        String(startDate.getMonth() + 1).padStart(2, '0') + '-' +
                        String(startDate.getDate()).padStart(2, '0');
                    filteredDates = dates.filter(d => d >= startStr);
                }

                const labels = filteredDates.map(d => {
                    const parts = d.split('-');
                    return parts[1] + '/' + parts[2];
                });
                const values = filteredDates.map(d => all[d].total || 0);
                const fullDates = filteredDates;

                return {
                    labels,
                    values,
                    fullDates,
                    isEmpty: values.length === 0 || values.every(v => v === 0),
                };
            }

            const chartColors = [
                'rgba(255,140,148,0.75)',
                'rgba(126,203,154,0.75)',
                'rgba(126,200,227,0.75)',
                'rgba(195,174,214,0.75)',
                'rgba(255,179,134,0.75)',
                'rgba(255,217,125,0.75)',
                'rgba(255,154,162,0.75)',
                'rgba(162,210,180,0.75)',
                'rgba(162,210,230,0.75)',
                'rgba(210,190,225,0.75)',
                'rgba(255,200,160,0.75)',
                'rgba(255,230,150,0.75)',
            ];
            const chartBorderColors = [
                '#FF8C94', '#7ECB9A', '#7EC8E3', '#C3AED6',
                '#FFB386', '#FFD97D', '#FF9AA2', '#8CC9A0',
                '#8CC9E0', '#BBA5CC', '#FFC090', '#FFD060',
            ];

            function renderChart() {
                const chartData = getChartData(currentRange);

                // 显示/隐藏无数据提示
                if (chartData.isEmpty) {
                    noDataHint.style.display = 'block';
                } else {
                    noDataHint.style.display = 'none';
                }

                // 准备Canvas渐变
                const canvas = document.getElementById('writingChart');
                const ctx = canvas.getContext('2d');

                // 销毁旧图表
                if (chartInstance) {
                    chartInstance.destroy();
                    chartInstance = null;
                }

                if (chartData.isEmpty && chartData.labels.length === 0) {
                    // 完全无数据，画一个空图表占位
                    chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['暂无数据'],
                            datasets: [{
                                label: '写作字数',
                                data: [0],
                                backgroundColor: 'rgba(200,200,200,0.3)',
                                borderColor: 'rgba(200,200,200,0.5)',
                                borderWidth: 2,
                                borderRadius: 16,
                                borderSkipped: false,
                            }],
                        },
                        options: getChartOptions(true),
                    });
                    return;
                }

                if (chartData.isEmpty && chartData.labels.length > 0) {
                    // 有日期但数值全为0
                    chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: chartData.labels,
                            datasets: [{
                                label: '写作字数',
                                data: chartData.values,
                                backgroundColor: 'rgba(200,200,200,0.25)',
                                borderColor: 'rgba(200,200,200,0.4)',
                                borderWidth: 2,
                                borderRadius: 16,
                                borderSkipped: false,
                            }],
                        },
                        options: getChartOptions(false),
                    });
                    return;
                }

                // 正常数据
                const bgColors = chartData.values.map((_, i) => chartColors[i % chartColors.length]);
                const bColors = chartData.values.map((_, i) => chartBorderColors[i % chartBorderColors.length]);

                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: chartData.labels,
                        datasets: [{
                            label: '📝 当日写作字数',
                            data: chartData.values,
                            backgroundColor: bgColors,
                            borderColor: bColors,
                            borderWidth: 2.5,
                            borderRadius: 14,
                            borderSkipped: false,
                            hoverBackgroundColor: bgColors.map(c => c.replace('0.75', '0.9')),
                            hoverBorderWidth: 3.5,
                        }],
                    },
                    options: getChartOptions(false),
                    plugins: [{
                        id: 'customDataLabels',
                        afterDatasetsDraw(chart) {
                            const ctx2 = chart.ctx;
                            const meta = chart.getDatasetMeta(0);
                            if (!meta || !meta.data) return;
                            meta.data.forEach((bar, i) => {
                                const value = chartData.values[i];
                                if (value === 0) return;
                                const x = bar.x;
                                const y = bar.y - 8;
                                ctx2.save();
                                ctx2.font = 'bold 0.7rem "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif';
                                ctx2.fillStyle = chartBorderColors[i % chartBorderColors.length];
                                ctx2.textAlign = 'center';
                                ctx2.textBaseline = 'bottom';
                                ctx2.fillText(value.toLocaleString(), x, y);
                                // 小星星
                                ctx2.font = '0.65rem sans-serif';
                                ctx2.fillText('⭐', x, y - 16);
                                ctx2.restore();
                            });
                        },
                    }],
                });
            }

            function getChartOptions(isEmpty) {
                return {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 800,
                        easing: 'easeOutBounce',
                    },
                    layout: {
                        padding: {
                            top: 30,
                            right: 10,
                            bottom: 10,
                            left: 10,
                        },
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false,
                            },
                            ticks: {
                                font: {
                                    family: '"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
                                    size: 12,
                                    weight: '600',
                                },
                                color: '#8B7B7B',
                            },
                            border: {
                                color: '#E8E0DA',
                                width: 2,
                            },
                        },
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(200,190,180,0.2)',
                                lineWidth: 1.5,
                                drawBorder: false,
                            },
                            ticks: {
                                font: {
                                    family: '"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
                                    size: 11,
                                    weight: '500',
                                },
                                color: '#B5A8A8',
                                callback: function(val) {
                                    return val >= 1000 ? (val / 1000) + 'k' : val;
                                },
                                stepSize: function() {
                                    const chart = this.chart;
                                    const maxVal = chart.data.datasets[0]?.data?.reduce((a, b) => Math
                                        .max(a, b), 0) || 1000;
                                    if (maxVal <= 500) return 100;
                                    if (maxVal <= 2000) return 250;
                                    if (maxVal <= 5000) return 500;
                                    return 1000;
                                }(),
                            },
                            border: {
                                color: '#E8E0DA',
                                width: 2,
                            },
                        },
                    },
                    plugins: {
                        legend: {
                            display: !isEmpty,
                            position: 'top',
                            labels: {
                                font: {
                                    family: '"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
                                    size: 13,
                                    weight: '700',
                                },
                                color: '#5D4E4E',
                                usePointStyle: true,
                                pointStyleWidth: 10,
                                padding: 20,
                            },
                        },
                        tooltip: {
                            backgroundColor: 'rgba(255,255,255,0.96)',
                            titleColor: '#5D4E4E',
                            bodyColor: '#5D4E4E',
                            titleFont: {
                                family: '"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
                                size: 14,
                                weight: '700',
                            },
                            bodyFont: {
                                family: '"Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
                                size: 13,
                                weight: '600',
                            },
                            borderColor: '#E8E0DA',
                            borderWidth: 2,
                            cornerRadius: 14,
                            padding: 14,
                            displayColors: true,
                            boxPadding: 6,
                            callbacks: {
                                label: function(ctx) {
                                    return ' 📝 ' + ctx.parsed.y.toLocaleString() + ' 字';
                                },
                                title: function(ctxArr) {
                                    const idx = ctxArr[0].dataIndex;
                                    const chartData = getChartData(currentRange);
                                    return '📅 ' + (chartData.fullDates[idx] || ctxArr[0].label);
                                },
                            },
                        },
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                };
            }

            function refreshChart() {
                renderChart();
                updateAllStats();
            }

            // ==================== 事件处理 ====================
            function onInputChange() {
                updateTotalDisplay();
            }

            function onDateChange(newDateStr) {
                currentDate = newDateStr;
                datePicker.value = currentDate;
                loadDateData(currentDate);
                updateAllStats();
            }

            function saveCurrentData() {
                const alpha = parseInt(alphaInput.value) || 0;
                const beta = parseInt(betaInput.value) || 0;
                const yesterdayBeta = getYesterdayBeta(currentDate);
                const total = calculateTotal(alpha, beta, yesterdayBeta);
                const goal = getDailyGoal();

                const dayData = {
                    alpha: alpha,
                    beta: beta,
                    total: total,
                    savedAt: new Date().toISOString(),
                };

                setDayData(currentDate, dayData);

                // 检查下一天是否有数据，如果有则更新其total
                const nextDayStr = addDays(currentDate, 1);
                const nextDayData = getDayData(nextDayStr);
                if (nextDayData) {
                    const nextYesterdayBeta = beta; // 当前保存的beta就是下一天的"昨日beta"
                    const newNextTotal = calculateTotal(nextDayData.alpha, nextDayData.beta, nextYesterdayBeta);
                    nextDayData.total = newNextTotal;
                    setDayData(nextDayStr, nextDayData);
                }

                pulseTotalDisplay();
                refreshChart();
                updateAllStats();

                // 如果达到目标，庆祝
                if (total >= goal && total > 0) {
                    spawnConfetti();
                    showToast('🎉 太棒了！达成今日目标！(' + total.toLocaleString() + ' / ' + goal.toLocaleString() +
                        ' 字)',
                        'success');
                } else if (total > 0) {
                    const remaining = goal - total;
                    showToast('✅ 数据已保存！还差 ' + remaining.toLocaleString() + ' 字达成目标，继续加油！', 'success');
                } else {
                    showToast('✅ 数据已保存！', 'success');
                }

                // 更新当前日期显示（可能因为级联更新而变化）
                loadDateData(currentDate);
            }

            function resetForm() {
                alphaInput.value = '';
                betaInput.value = '';
                updateTotalDisplay();
                showToast('🔄 表单已清空', 'info');
            }

            function goToToday() {
                const todayStr = getTodayStr();
                if (currentDate !== todayStr) {
                    onDateChange(todayStr);
                } else {
                    loadDateData(todayStr);
                    updateTotalDisplay();
                }
                showToast('🏠 已切换到今天', 'info');
            }

            function goToPrevDay() {
                const newDate = addDays(currentDate, -1);
                onDateChange(newDate);
            }

            function goToNextDay() {
                const newDate = addDays(currentDate, 1);
                // 不允许超过今天
                const todayStr = getTodayStr();
                if (newDate > todayStr) {
                    showToast('📅 不能选择未来日期哦～', 'info');
                    return;
                }
                onDateChange(newDate);
            }

            function changeRange(range) {
                currentRange = range;
                rangeBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.range) === range || (btn
                        .dataset.range === 'all' && range === 'all'));
                });
                refreshChart();
            }

            function handleGoalClick() {
                const currentGoal = getDailyGoal();
                const newGoalStr = prompt('🎯 请设置每日写作目标字数：', currentGoal);
                if (newGoalStr !== null) {
                    const newGoal = parseInt(newGoalStr, 10);
                    if (isNaN(newGoal) || newGoal <= 0) {
                        showToast('⚠️ 请输入有效的正整数字数目标', 'info');
                        return;
                    }
                    setDailyGoal(newGoal);
                    dailyGoalDisplay.textContent = newGoal.toLocaleString();
                    updateAllStats();
                    updateTotalDisplay();
                    showToast('⭐ 每日目标已更新为 ' + newGoal.toLocaleString() + ' 字', 'success');
                }
            }

            // ==================== 事件绑定 ====================
            alphaInput.addEventListener('input', onInputChange);
            betaInput.addEventListener('input', onInputChange);
            datePicker.addEventListener('change', function() {
                const selectedDate = datePicker.value;
                const todayStr = getTodayStr();
                if (selectedDate > todayStr) {
                    showToast('📅 不能选择未来日期哦～', 'info');
                    datePicker.value = currentDate;
                    return;
                }
                onDateChange(selectedDate);
            });
            btnSave.addEventListener('click', saveCurrentData);
            btnReset.addEventListener('click', resetForm);
            btnToday.addEventListener('click', goToToday);
            btnPrevDay.addEventListener('click', goToPrevDay);
            btnNextDay.addEventListener('click', goToNextDay);
            goalCard.addEventListener('click', handleGoalClick);

            rangeBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const range = this.dataset.range === 'all' ? 'all' : parseInt(this.dataset
                        .range);
                    changeRange(range);
                });
            });

            // 键盘快捷键 Ctrl+S 保存
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    saveCurrentData();
                }
            });

            // ==================== 初始化 ====================
            function init() {
                currentDate = getTodayStr();
                datePicker.value = currentDate;
                datePicker.setAttribute('max', getTodayStr());
                loadDateData(currentDate);
                dailyGoalDisplay.textContent = getDailyGoal().toLocaleString();
                renderChart();
                updateAllStats();
                updateTotalDisplay();
            }

            init();

            // ==================== 窗口大小变化时重绘图表 ====================
            let resizeDebounce = null;
            window.addEventListener('resize', function() {
                if (resizeDebounce) clearTimeout(resizeDebounce);
                resizeDebounce = setTimeout(() => {
                    if (chartInstance) {
                        chartInstance.resize();
                    }
                }, 200);
            });

            console.log('✍️  每日写作统计已就绪！');
            console.log('💡 提示：使用 Ctrl+S 快速保存数据');
            console.log('📊 数据存储在浏览器本地存储中');
            console.log('🎯 点击底部"每日目标字数"卡片可修改目标');
        })();
    </script>
</body>
</html>
